def validateDlssSdk = tasks.register("validateDlssSdk") {
	group = "verification"
	description = "Validates the pinned DLSS headers and native payloads used by the selected NGX bundle."
	inputs.property("dlssSdk", dlssSdkEnv.orElse(""))
	inputs.property("dlssCommit", expectedDlssSdkCommit)
	inputs.property("dlssHeaderHashes", expectedDlssSdkHeaderHashes.toString())
	inputs.property("dlssPayloadHashes", expectedDlssSdkPayloadHashes.toString())
	inputs.property("dlssRuntimeHashes", expectedDlssSdkRuntimeHashes.toString())
	inputs.property("ngxVendorConfig", ngxVendorConfig)
	inputs.property("ngxPlatforms", selectedNgxNativePlatforms*.name.join(","))
	outputs.upToDateWhen { false }
	doLast {
		File sdk = dlssSdkRootProvider.orNull
		if (sdk == null || !sdk.isDirectory()) {
			throw new GradleException("DLSS_SDK must point to the pinned SDK checkout ${expectedDlssSdkCommit}.")
		}
		def runGit = { List<String> arguments ->
			def command = ["git", "-C", sdk.absolutePath] + arguments
			def process = new ProcessBuilder(command).redirectErrorStream(true).start()
			def output = process.inputStream.getText("UTF-8").trim()
			[status: process.waitFor(), output: output]
		}
		def head = runGit(["rev-parse", "HEAD"])
		if (head.status != 0 || !head.output.equalsIgnoreCase(expectedDlssSdkCommit)) {
			throw new GradleException("DLSS_SDK HEAD ${head.output} is not pinned to ${expectedDlssSdkCommit}")
		}
		def status = runGit(["status", "--porcelain", "--untracked-files=all"])
		if (status.status != 0 || !status.output.isEmpty()) {
			throw new GradleException(status.status == 0
					? "DLSS_SDK checkout is dirty: ${status.output}"
					: "Could not read DLSS_SDK checkout status: ${status.output}")
		}
		def requireHash = { String label, File input, String expected, boolean textInput ->
			if (!input.isFile()) throw new GradleException("Missing pinned ${label}: ${input}")
			def actual = textInput ? sha256TextFile(input) : sha256File(input)
			if (!actual.equalsIgnoreCase(expected)) {
				throw new GradleException("DLSS_SDK hash mismatch for ${label}: ${actual} != ${expected}")
			}
		}
		expectedDlssSdkHeaderHashes.each { relative, expected ->
			requireHash(relative, new File(sdk, relative), expected, true)
		}
		selectedNgxNativePlatforms.each { platform ->
			def staticLibrary = expectedDlssSdkPayloadHashes[platform.name].staticLibrary
			requireHash("${platform.name} static library", new File(sdk, staticLibrary[0]), staticLibrary[1], false)
			File vendorRoot = platform.vendorRoot(sdk, ngxVendorConfig)
			expectedDlssSdkRuntimeHashes[platform.name][ngxVendorConfig].each { baseName, expected ->
				File runtime = new File(vendorRoot, baseName)
				if (!runtime.isFile() && platform.name == "linux-x64") {
					def candidates = fileTree(vendorRoot) { include "${baseName}.*" }.files.sort { it.name }
					if (candidates.size() != 1) {
						throw new GradleException("Expected one ${baseName} runtime in ${vendorRoot}, found ${candidates*.name}")
					}
					runtime = candidates[0]
				}
				requireHash("${platform.name} ${runtime.name}", runtime, expected, false)
			}
		}
	}
}

def ngxShimBuildType = ngxShimConfig == "debug" ? "Debug" : "Release"
def ngxShimBuildRoot = file("build/cmake/ngx_shim/${ngxShimConfig}")
def ngxShimBinaryName = currentNgxPlatform == "windows-x64" ? "ngxshim.dll" : "libngxshim.so"
def ngxShimBinary = new File(ngxShimOutDir, ngxShimBinaryName)
abstract class BuildNgxShim extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSourceDir()
	@Input abstract Property<String> getBuildRoot()
	@Input abstract Property<String> getBuildType()
	@Input abstract Property<String> getCmakeExecutable()
	@Input abstract Property<String> getDlssSdk()
	@Input abstract Property<String> getVulkanSdk()
	@Input abstract ListProperty<String> getConfigureArgs()
	@OutputFile abstract RegularFileProperty getOutputFile()

	@Inject abstract ExecOperations getExecOps()

	@TaskAction
	void build() {
		String dlssSdkPath = dlssSdk.get()
		String vulkanSdkPath = vulkanSdk.get()
		if (!dlssSdkPath || !new File(dlssSdkPath).isDirectory()) {
			throw new GradleException("DLSS_SDK must point to the pinned SDK checkout before building the NGX shim.")
		}
		if (!vulkanSdkPath || !new File(vulkanSdkPath).isDirectory()) {
			throw new GradleException("VULKAN_SDK must point to the Vulkan SDK before building the NGX shim.")
		}
		File buildRoot = new File(buildRoot.get())
		if (buildRoot.exists() && !buildRoot.deleteDir()) {
			throw new GradleException("Could not clear the NGX CMake build directory: ${buildRoot}")
		}
		String cmake = cmakeExecutable.get()
		def configure = ["-S", sourceDir.get().asFile.absolutePath, "-B", buildRoot.absolutePath]
		configure.addAll(configureArgs.get())
		getExecOps().exec {
			commandLine([cmake] + configure)
			environment "DLSS_SDK", dlssSdkPath
			environment "VULKAN_SDK", vulkanSdkPath
		}
		getExecOps().exec {
			commandLine([cmake, "--build", buildRoot.absolutePath, "--config", buildType.get(), "--target", "ngxshim", "--parallel"])
			environment "DLSS_SDK", dlssSdkPath
			environment "VULKAN_SDK", vulkanSdkPath
		}
		File output = outputFile.get().asFile
		if (!output.isFile()) {
			throw new GradleException("NGX shim build succeeded but did not produce ${output}")
		}
	}
}

def cmakeForNgxShim = locateExecutable((findProperty("releaseCmake") ?: "cmake").toString())
def buildNgxShim = tasks.register("buildNgxShim", BuildNgxShim) {
	group = "build"
	description = "Rebuilds the NGX shim from the current native source before packaging it."
	dependsOn(validateDlssSdk)
	sourceDir.set(layout.projectDirectory.dir("native/ngx_shim"))
	buildRoot.set(ngxShimBuildRoot.absolutePath)
	buildType.set(ngxShimBuildType)
	cmakeExecutable.set(cmakeForNgxShim?.absolutePath ?: "cmake")
	dlssSdk.set(dlssSdkRootProvider.map { it.absolutePath }.orElse(""))
	vulkanSdk.set(providers.environmentVariable("VULKAN_SDK").orElse(""))
	configureArgs.set(org.gradle.internal.os.OperatingSystem.current().windows
			? ["-G", "Visual Studio 17 2022", "-A", "x64"]
			: ["-DCMAKE_BUILD_TYPE=${ngxShimBuildType}"])
	outputFile.set(ngxShimBinary)
	inputs.files(fileTree("native/ngx_shim"))
}

def bundleNgxNatives = tasks.register("bundleNgxNatives") {
	group = "build"
	description = "Bundles NGX shim and ${ngxVendorConfig} DLSS native libraries into the mod resources."
	dependsOn(buildNgxShim)

	inputs.property "ngxShimConfig", ngxShimConfig
	inputs.property "ngxVendorConfig", ngxVendorConfig

	selectedNgxNativePlatforms.each { platform ->
		inputs.files(fileTree(ngxShimOutDir) {
			include platform.shimIncludes
		}).withPropertyName("ngxNatives.${platform.name}.shim")
		inputs.files(fileTree(platform.vendorRoot(dlssSdkRootProvider.getOrElse(file("__missing_dlss_sdk__")), ngxVendorConfig)) {
			include platform.vendorIncludes
		}).withPropertyName("ngxNatives.${platform.name}.vendor")
	}
	outputs.dir(ngxNativeGenRoot)
	outputs.upToDateWhen { false }

	doLast {
		delete(ngxNativeGenRoot)
		def missing = []
		def dlssSdkRoot = dlssSdkRootProvider.orNull
		if (dlssSdkRoot == null) {
			throw new GradleException("DLSS_SDK environment variable is not set.")
		}
		selectedNgxNativePlatforms.each { platform ->
			def platformShimFiles = fileTree(ngxShimOutDir) {
				include platform.shimIncludes
			}.files
			if (platformShimFiles.empty) {
				missing += "${platform.name} shim library in ${ngxShimOutDir}"
			}
		}
		selectedNgxNativePlatforms.each { platform ->
			def platformVendorRoot = platform.vendorRoot(dlssSdkRoot, ngxVendorConfig)
			def missingVendorIncludes = platform.vendorIncludes.findAll { vendorInclude ->
				fileTree(platformVendorRoot) {
					include vendorInclude
				}.files.empty
			}
			if (!missingVendorIncludes.empty) {
				missing += "${platform.name} vendor libraries ${missingVendorIncludes.join(', ')} in ${platformVendorRoot}"
			}
		}
		if (!missing.empty) {
			throw new GradleException("Missing NGX native inputs:\n - " + missing.join("\n - "))
		}

		copy {
			selectedNgxNativePlatforms.each { platform ->
				from(fileTree(ngxShimOutDir) {
					include platform.shimIncludes
				}) {
					into "caustica/natives/${platform.name}"
				}
				from(fileTree(platform.vendorRoot(dlssSdkRoot, ngxVendorConfig))) {
					include platform.vendorIncludes
					into "caustica/natives/${platform.name}"
				}
			}
			into ngxNativeGenRoot
		}
	}
}

