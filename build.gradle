import javax.inject.Inject
import org.gradle.process.ExecOperations
import dev.comfyfluffy.caustica.build.GenerateShaderRecords
import dev.comfyfluffy.caustica.build.GenerateRtBindings
import java.security.MessageDigest

plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
}

loom {
	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated = true
			runDir = "run"
			// java.lang.foreign restricted methods (FFM bindings to amd_fidelityfx_vk.dll)
			vmArg "--enable-native-access=ALL-UNNAMED"

            // NVIDIA NGX (DLSS) allocates ~1MB on the stack during init, which overflows Java's default 1MB thread stack.
            // pass -Xss here directly so the main render thread is resized before the VM parses JAVA_TOOL_OPTIONS.
            vmArg "-Xss16m"

            // NixOS fix: Gradle forks drop the dev-shell's LD_LIBRARY_PATH.
            // We manually add the driver path so NGX can successfully dlopen libnvidia-ngx.so.1.
            if (file("/run/opengl-driver/lib").exists()) {
                def inherited = System.getenv("LD_LIBRARY_PATH")
                environmentVariable "LD_LIBRARY_PATH",
                        inherited ? "/run/opengl-driver/lib:${inherited}" : "/run/opengl-driver/lib"
            }
		}

		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated = true
			runDir = "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Layered TOML config (config/caustica.toml) — NightConfig, the same library NeoForge's
	// ModConfigSpec is built on.
	include implementation("com.electronwill.night-config:core:3.8.3")
	include implementation("com.electronwill.night-config:toml:3.8.3")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Compile Slang sources to SPIR-V at build time instead of tracking binaries. Requires slangc and
// spirv-val from the Vulkan SDK or PATH.
def shaderGenRoot = layout.buildDirectory.dir("generated/shaders") // classpath root -> /caustica/shaders/*.spv

// NVIDIA SHaRC is an optional, separately licensed shader input. The ordinary build remains stock when
// SHARC_SDK is absent; an explicitly configured SDK must be the pinned 1.8.0.0 checkout so the shader ABI
// cannot silently drift from the generated Java records and runtime cache layout.
def sharcVersion = "1.8.0.0"
def sharcCommit = "e19ccacd511f42a3df6f850052d508c13c9e9737"
def sharcHashes = [
		"include/SharcCommon.h": "d4b6e2765828a4b1c71bbf40609b2dbe72b4aec8ff4d80ccda21a83ab634ecc4",
		"include/SharcTypes.h": "cde3f200e4e84f029968dffd9eede5228f2ae0b0bbc166d2babb1aa88dc044b3",
		"include/HashGridCommon.h": "5a6d67186a88e61f0d47518f5986021f309f2897ccb482ab9e011a7a08749e7f",
		"include/HashGridTypes.h": "34012bcffff0f2545c108a7c9dcb223298a70ebc2c377a86fbddfd1ecd76d614",
		"License.md": "5575ad921bfe6027dc830887ff51ceb4097e31c2d538b6932cd4bbdf5c1899a9"
]
def configuredSharcSdk = (findProperty("sharcSdk") ?: System.getenv("SHARC_SDK"))?.toString()?.trim()
def sharcLicenseProperty = findProperty("acceptSharcLicense")
def sharcLicenseAccepted = sharcLicenseProperty != null
        ? sharcLicenseProperty.toString().toBoolean()
        : (System.getenv("SHARC_LICENSE_ACCEPTED")?.toBoolean() ?: false)
def sha256File = { File input ->
	def digest = MessageDigest.getInstance("SHA-256")
	input.withInputStream { stream ->
		byte[] buffer = new byte[64 * 1024]
		int read
		while ((read = stream.read(buffer)) >= 0) {
			if (read > 0) digest.update(buffer, 0, read)
		}
	}
	digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}
def sha256TextFile = { File input ->
	def normalized = input.getText("UTF-8").replace("\r\n", "\n").replace("\r", "\n")
	def digest = MessageDigest.getInstance("SHA-256")
	digest.update(normalized.getBytes(java.nio.charset.StandardCharsets.UTF_8))
	digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}
def sharcSdkRoot = configuredSharcSdk ? file(configuredSharcSdk) : null
def validateSharcSdk = { File sdk ->
	if (sdk == null) return
	if (!sharcLicenseAccepted) {
		throw new GradleException("SHARC_SDK is set, but the NVIDIA SHaRC 1.8 license was not explicitly accepted. "
				+ "Pass -PacceptSharcLicense=true after reviewing ${new File(sdk, 'License.md')}")
	}
	if (!sdk.isDirectory()) {
		throw new GradleException("SHARC_SDK must point to the pinned git checkout ${sharcCommit}: ${sdk}")
	}
	def head = new ProcessBuilder("git", "-C", sdk.absolutePath, "rev-parse", "HEAD")
			.redirectErrorStream(true).start()
	def headText = head.inputStream.text.trim()
	if (head.waitFor() != 0 || !headText.equalsIgnoreCase(sharcCommit)) {
		throw new GradleException("SHARC_SDK HEAD ${headText} is not pinned to ${sharcCommit}")
	}
	def status = new ProcessBuilder("git", "-C", sdk.absolutePath, "status", "--porcelain", "--untracked-files=all")
			.redirectErrorStream(true).start()
	def statusText = status.inputStream.text.trim()
	if (status.waitFor() != 0 || !statusText.isEmpty()) {
		throw new GradleException(status.exitValue() == 0
				? "SHARC_SDK checkout is dirty: ${statusText}"
				: "Could not read SHARC_SDK checkout status: ${statusText}")
	}
	def common = new File(sdk, "include/SharcCommon.h")
	if (!common.isFile()) throw new GradleException("Missing pinned SHaRC header: ${common}")
	def commonText = common.getText("UTF-8")
	["SHARC_VERSION_MAJOR": "1", "SHARC_VERSION_MINOR": "8", "SHARC_VERSION_BUILD": "0",
	 "SHARC_VERSION_REVISION": "0"].each { name, value ->
		if (!(commonText =~ /#define\s+${name}\s+${value}(?:\s|$)/)) {
			throw new GradleException("SHARC_SDK ${common} does not declare ${name}=${value}")
		}
	}
	sharcHashes.each { relative, expected ->
		def input = new File(sdk, relative)
		if (!input.isFile()) throw new GradleException("Missing pinned SHaRC input: ${input}")
		def actual = sha256TextFile(input)
		if (!actual.equalsIgnoreCase(expected)) {
			throw new GradleException("SHARC_SDK hash mismatch for ${relative}: ${actual} != ${expected}")
		}
	}
}
validateSharcSdk(sharcSdkRoot)
def sharcSdkContentFingerprint = sharcSdkRoot == null ? "" : sharcHashes.collect { relative, expected ->
	"${relative}:${sha256TextFile(new File(sharcSdkRoot, relative))}"
}.join("|")
def sharcLicenseRawHash = sharcSdkRoot == null ? "" : sha256File(new File(sharcSdkRoot, "License.md"))

def resolveVulkanTool = { String name ->
	def exe = org.gradle.internal.os.OperatingSystem.current().windows ? ".exe" : ""
	def sdk = System.getenv("VULKAN_SDK")
	if (sdk) {
		def fromSdk = file("${sdk}/Bin/${name}${exe}")
		if (fromSdk.exists()) {
			return fromSdk.absolutePath
		}
	}
	return "${name}${exe}" // fall back to PATH; exec fails with a clear message if absent
}

def locateExecutable = { String command ->
	def direct = file(command)
	if (direct.isFile()) return direct
	def windows = org.gradle.internal.os.OperatingSystem.current().windows
	def names = windows && !command.toLowerCase(java.util.Locale.ROOT).endsWith(".exe")
			? [command, "${command}.exe"] : [command]
	def path = System.getenv("PATH") ?: ""
	for (String entry : path.split(java.io.File.pathSeparator)) {
		if (entry.isEmpty()) continue
		for (String name : names) {
			def candidate = new File(entry, name)
			if (candidate.isFile()) return candidate
		}
	}
	return null
}

def locateVulkanTool = { String command -> locateExecutable(command) }

// Keep executable paths as task inputs for diagnostics, and hash their contents so replacing a
// compiler or validator at the same path invalidates generated outputs.
def toolContentFingerprint = { String command ->
	def executable = locateVulkanTool(command)
	if (executable == null) return "unresolved:${command}"
	return "${executable.absolutePath}:${sha256File(executable)}"
}

def runIdentityCommand = { File executable, List<String> arguments ->
	if (executable == null || !executable.isFile()) {
		return [status: "missing", output: ""]
	}
	def commandLine = new ArrayList<String>()
	commandLine.add(executable.absolutePath)
	commandLine.addAll(arguments.collect { it.toString() })
	def process = new ProcessBuilder(commandLine)
			.redirectErrorStream(true).start()
	def output = process.inputStream.getText("UTF-8").trim()
	def exitCode = process.waitFor()
	[status: exitCode == 0 ? "ok" : "failed-${exitCode}", output: output]
}

def slangcTool = resolveVulkanTool("slangc")
def spirvValTool = resolveVulkanTool("spirv-val")
def minimumSlangVersion = [2026, 4]
def validateSlangCompiler = {
	File executable = locateVulkanTool(slangcTool)
	if (executable == null || !executable.isFile()) {
		throw new GradleException("slangc was not found. Set VULKAN_SDK to a Vulkan SDK containing Slang ${minimumSlangVersion[0]}.${minimumSlangVersion[1]} or newer.")
	}
	def result = runIdentityCommand(executable, ["-version"])
	if (result.status != "ok") {
		throw new GradleException("Could not query slangc at ${executable}: ${result.output}")
	}
	def match = result.output =~ /(\d{4})\.(\d+)/
	if (!match.find()) {
		throw new GradleException("Could not parse slangc version from ${executable}: ${result.output}")
	}
	int major = match.group(1).toInteger()
	int minor = match.group(2).toInteger()
	if (major < minimumSlangVersion[0] || (major == minimumSlangVersion[0] && minor < minimumSlangVersion[1])) {
		throw new GradleException("slangc ${major}.${minor} at ${executable} is too old; Caustica requires Slang ${minimumSlangVersion[0]}.${minimumSlangVersion[1]} or newer. "
				+ "Point VULKAN_SDK at the compatible SDK so its slangc and spirv-val are selected together.")
	}
}
def validateShaderToolchain = tasks.register("validateShaderToolchain") {
	group = "verification"
	description = "Checks that the selected Slang compiler supports Caustica's shader pointer layout syntax."
	inputs.property("slangc", slangcTool)
	inputs.property("slangcContentHash", toolContentFingerprint(slangcTool))
	doLast { validateSlangCompiler() }
}

abstract class CompileShaders extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSrcDir()
	@OutputDirectory abstract DirectoryProperty getOutDir()
	@Input abstract Property<String> getSpirvVal()
	@Input abstract Property<String> getSlangc()
	@Input abstract Property<String> getSpirvValContentHash()
	@Input abstract Property<String> getSlangcContentHash()
	@Input abstract Property<String> getSharcSdk()
	@Input abstract Property<String> getSharcSdkContentHash()

	@Inject abstract ExecOperations getExecOps()

	// pipelines/display/main.comp.slang -> pipelines/display/main.comp.
	static String outBase(File root, File src) {
		def relative = root.toPath().relativize(src.toPath()).toString().replace('\\', '/')
		return relative.endsWith(".slang") ? relative.substring(0, relative.length() - 6) : relative
	}

	@TaskAction
	void compile() {
		def outDirFile = outDir.get().asFile
		// Slang stages are named <name>.<stage>.slang (any_hit.rahit.slang -> any_hit.rahit.spv); module files
		// like world_common.slang match no stage glob and are picked up only via `import`.
		def stageIncludes = ["rgen", "rchit", "rahit", "rmiss", "rcall", "comp", "vert", "frag"]
				.collect { stage -> "**/*.${stage}.slang" }
		def validate = { File spv ->
			execOps.exec {
				commandLine spirvVal.get(), "--target-env", "vulkan1.2", spv.absolutePath
			}
		}
		def includeDirs = srcDir.get().asFileTree.matching { include "**/*.slang" }.files
				.collect { it.parentFile }.unique().sort { it.absolutePath }
		def compileOneSlang = { File src, File spv, List<String> extra ->
			spv.parentFile.mkdirs()
			def includes = [src.parentFile] + includeDirs.findAll { it != src.parentFile }
			execOps.exec {
				// Embed Slang source and line mappings in SPIR-V for RenderDoc/Nsight source debugging.
				commandLine([slangc.get(), src.absolutePath, "-target", "spirv",
						"-profile", "spirv_1_5", "-matrix-layout-column-major",
						"-warnings-as-errors", "all", "-warnings-disable", "41012", "-g"]
						+ includes.collectMany { ["-I", it.absolutePath] } + extra
						+ ["-o", spv.absolutePath])
			}
			validate(spv)
		}
		def shaderFiles = srcDir.get().asFileTree.matching {
			include stageIncludes
			exclude "sharc/**"
		}.files.sort { it.absolutePath }
		def duplicateOutputs = shaderFiles
				.groupBy { "${outBase(srcDir.get().asFile, it)}.spv" }
				.findAll { entry -> entry.value.size() > 1 }
		if (!duplicateOutputs.isEmpty()) {
			throw new GradleException("Duplicate shader output name(s): "
					+ duplicateOutputs.collect { entry -> "${entry.key} from ${entry.value*.path.join(', ')}" }.join("; "))
		}
		// Compile into Gradle's task-temporary directory. A compiler or validator failure leaves the last
		// successful published output intact instead of emptying build/generated/shaders halfway through.
		def scratchDir = new File(temporaryDir, "spv")
		if (scratchDir.exists() && !scratchDir.deleteDir()) {
			throw new GradleException("failed to clear shader scratch directory ${scratchDir}")
		}
		scratchDir.mkdirs()
		shaderFiles.each { src ->
			def base = outBase(srcDir.get().asFile, src)
			def spv = new File(scratchDir, "${base}.spv")
			def worldIndirectRaygen = base == "pipelines/world/indirect.rgen"
			if (worldIndirectRaygen) {
				// Keep a capability-free TraceRay fallback for devices without EXT SER, and
				// publish the reordered variant separately when the extension is available.
				compileOneSlang(src, spv, [])
				compileOneSlang(src, new File(scratchDir, "pipelines/world/indirect_ser.rgen.spv"),
						["-DCAUSTICA_ENABLE_EXT_SER", "-capability", "spvShaderInvocationReorderEXT"])
			} else {
				// Pass A intentionally uses ordinary TraceRay.
				compileOneSlang(src, spv, [])
			}
		}
		File sdk = sharcSdk.getOrElse("").trim() ? new File(sharcSdk.get()) : null
		if (sdk != null) {
			// The pinned SDK header has a false-return path whose out parameter is not initialized. Slang
			// diagnoses that under warnings-as-errors. The source/header hashes above validate the original;
			// this disposable copy only repairs the compiler warning and is never packaged.
			File compilerInclude = new File(temporaryDir, "sharc-include")
			project.copy { from(new File(sdk, "include")); into(compilerInclude) }
			File common = new File(compilerInclude, "SharcCommon.h")
			String commonText = common.getText("UTF-8")
			int functionStart = commonText.indexOf("bool SharcGetCachedRadiance")
			int functionBrace = functionStart >= 0 ? commonText.indexOf("{", functionStart) : -1
			if (functionBrace < 0) throw new GradleException("Pinned SHaRC header lacks SharcGetCachedRadiance")
			common.setText(commonText.substring(0, functionBrace + 1)
					+ "\n    radiance = float3(0.0f, 0.0f, 0.0f);"
					+ commonText.substring(functionBrace + 1), "UTF-8")
			def sharcIncludes = ["-I", new File(srcDir.get().asFile, "pipelines/world").absolutePath,
					"-I", new File(srcDir.get().asFile, "sharc").absolutePath,
					"-I", compilerInclude.absolutePath]
			def sharcCapabilities = ["-capability", "spvInt64Atomics"]
			File indirectSource = new File(srcDir.get().asFile, "pipelines/world/indirect.rgen.slang")
        def variantArgs = ["-DCAUSTICA_SHARC_VARIANT=1", "-DSHARC_ENABLE_SH_ENCODING=1"] + sharcCapabilities + sharcIncludes
			compileOneSlang(indirectSource,
					new File(scratchDir, "pipelines/world/indirect_sharc_query.rgen.spv"),
					variantArgs + ["-DCAUSTICA_SHARC_QUERY=1"])
			compileOneSlang(indirectSource,
					new File(scratchDir, "pipelines/world/indirect_sharc_ser_query.rgen.spv"),
					variantArgs + ["-DCAUSTICA_SHARC_QUERY=1", "-DCAUSTICA_ENABLE_EXT_SER",
							"-capability", "spvShaderInvocationReorderEXT"])
			compileOneSlang(indirectSource,
					new File(scratchDir, "pipelines/world/indirect_sharc_update.rgen.spv"),
					variantArgs + ["-DCAUSTICA_SHARC_UPDATE=1"])
			compileOneSlang(indirectSource,
					new File(scratchDir, "pipelines/world/indirect_sharc_ser_update.rgen.spv"),
					variantArgs + ["-DCAUSTICA_SHARC_UPDATE=1", "-DCAUSTICA_ENABLE_EXT_SER",
							"-capability", "spvShaderInvocationReorderEXT"])
			compileOneSlang(new File(srcDir.get().asFile, "sharc/sharc_resolve.comp.slang"),
					new File(scratchDir, "sharc/sharc_resolve.comp.spv"),
					["-DSHARC_ENABLE_SH_ENCODING=1"] + sharcCapabilities + sharcIncludes)
		}
		if (outDirFile.exists() && !outDirFile.deleteDir()) {
			throw new GradleException("failed to clear generated shaders under ${outDirFile}")
		}
		outDirFile.mkdirs()
		scratchDir.eachFileRecurse(groovy.io.FileType.FILES) { src ->
			def relative = scratchDir.toPath().relativize(src.toPath())
			def destination = outDirFile.toPath().resolve(relative).toFile()
			destination.parentFile.mkdirs()
			java.nio.file.Files.move(src.toPath(), destination.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

def compileShaders = tasks.register("compileShaders", CompileShaders) {
	group = "build"
	description = "Compiles shaders/** shader sources to SPIR-V and validates them."
	srcDir = file("shaders")
	outDir = layout.buildDirectory.dir("generated/shaders/caustica/shaders")
	spirvVal = spirvValTool
	spirvValContentHash = toolContentFingerprint(spirvValTool)
	slangc = slangcTool
	slangcContentHash = toolContentFingerprint(slangcTool)
	sharcSdk = sharcSdkRoot?.absolutePath ?: ""
	sharcSdkContentHash = sharcSdkContentFingerprint
	dependsOn(validateShaderToolchain)
}

def generateShaderRecords = tasks.register("generateShaderRecords", GenerateShaderRecords) {
	group = "build"
	description = "Generates typed Java shader records and serializers from Slang reflection."
	shaderRoot = file("shaders")
	probeSource = file("shaders/layout/layout_probe.slang")
	slangc = slangcTool
	slangcContentHash = toolContentFingerprint(slangcTool)
	spirvVal = spirvValTool
	spirvValContentHash = toolContentFingerprint(spirvValTool)
	outDir = layout.buildDirectory.dir("generated/sources/shaderRecords")
	dependsOn(validateShaderToolchain)
}

def rtBindingsGenRoot = layout.buildDirectory.dir("generated/sources/rtBindings")
def generateRtBindings = tasks.register("generateRtBindings", GenerateRtBindings) {
	group = "build"
	description = "Generates Java descriptor bindings from Slang reflection."
	shaderRoot = file("shaders")
	slangc = slangcTool
	slangcContentHash = toolContentFingerprint(slangcTool)
	outDir = rtBindingsGenRoot
	dependsOn(validateShaderToolchain)
}

tasks.named("test", Test) {
	useJUnitPlatform()
}

sourceSets.main.java.srcDir(files(layout.buildDirectory.dir("generated/sources/shaderRecords")).builtBy(generateShaderRecords))
sourceSets.main.java.srcDir(files(rtBindingsGenRoot).builtBy(generateRtBindings))

// Emit the .spv into the main resources so they land in the jar / on the runClient classpath at the
// same /caustica/shaders/ path the pipeline loaders read. builtBy wires the dependency.
sourceSets.main.resources.srcDir(files(shaderGenRoot).builtBy(compileShaders))

def sharcMetadataRoot = layout.buildDirectory.dir("generated/sharc-metadata")
def generateSharcMetadata = tasks.register("generateSharcMetadata") {
	group = "build"
	description = "Publishes SHaRC 1.8 capability metadata only for an explicitly accepted SDK build."
	inputs.property("sharcSdk", sharcSdkRoot?.absolutePath ?: "")
	inputs.property("sharcCommit", sharcCommit)
	inputs.property("sharcVersion", sharcVersion)
	inputs.property("sharcHashes", sharcHashes.toString())
	inputs.property("sharcSdkContentHash", sharcSdkContentFingerprint)
	inputs.property("sharcLicenseRawHash", sharcLicenseRawHash)
	outputs.dir(sharcMetadataRoot)
	doLast {
		def root = sharcMetadataRoot.get().asFile
		delete(root)
		if (sharcSdkRoot == null) return
		def metadata = new File(root, "caustica/sharc.properties")
		metadata.parentFile.mkdirs()
		metadata.setText("""version=${sharcVersion}
commit=${sharcCommit}
sharcCommonSha256=${sharcHashes['include/SharcCommon.h']}
sharcTypesSha256=${sharcHashes['include/SharcTypes.h']}
hashGridCommonSha256=${sharcHashes['include/HashGridCommon.h']}
hashGridTypesSha256=${sharcHashes['include/HashGridTypes.h']}
licenseCanonicalTextSha256=${sharcHashes['License.md']}
licensePackagedSha256=${sharcLicenseRawHash}
artifacts=true
directionalSh=true
queryVariants=ordinary,ext-ser
updateVariants=ordinary,ext-ser
resolveVariants=directional-sh
shaderBufferInt64Atomics=true
shaderFloat16=true
storageBuffer16BitAccess=true
""", "UTF-8")
		copy {
			from(new File(sharcSdkRoot, "License.md"))
			into(new File(root, "META-INF/licenses/nvidia"))
			rename { "NVIDIA-SHARC-SDK.txt" }
		}
	}
}
sourceSets.main.resources.srcDir(files(sharcMetadataRoot).builtBy(generateSharcMetadata))

def ngxNativeGenRoot = layout.buildDirectory.dir("generated/ngx-natives")
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(java.util.Locale.ROOT) }
def isRunClientInvocation = requestedTaskNames.any { it == "runclient" || it.endsWith(":runclient") }
def ngxShimConfig = (findProperty("ngxShimConfig") ?: findProperty("ngxNativeConfig") ?: "release")
		.toString().toLowerCase(java.util.Locale.ROOT)
def normalizeNgxVendorConfig = { String config ->
	def normalized = config.toLowerCase(java.util.Locale.ROOT)
	if (normalized == "release") {
		return "rel"
	}
	if (normalized == "debug") {
		return "dev"
	}
	if (normalized != "rel" && normalized != "dev") {
		throw new GradleException("Unknown NGX vendor config '${config}'. Expected 'rel' or 'dev'.")
	}
	return normalized
}
def ngxVendorConfig = normalizeNgxVendorConfig(
		(findProperty("ngxVendorConfig") ?: (isRunClientInvocation ? "dev" : "rel")).toString())
def ngxNativeRoot = layout.buildDirectory.dir("native/ngx_shim").get().asFile
def ngxShimOutDir = new File(ngxNativeRoot, ngxShimConfig)
def currentNgxPlatform = {
	def os = org.gradle.internal.os.OperatingSystem.current()
	def arch = System.getProperty("os.arch", "").toLowerCase(java.util.Locale.ROOT)
	def x64 = arch == "x86_64" || arch == "amd64"
	if (os.windows && x64) {
		return "windows-x64"
	}
	if (os.linux && x64) {
		return "linux-x64"
	}
	return null
}()
def ngxNativePlatforms = [
	[
		name: "windows-x64",
		shimIncludes: [
			"ngxshim.dll"
		],
		vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Windows_x86_64/${vendorConfig}") },
		vendorIncludes: [
			"nvngx_dlssd.dll",
			"nvngx_dlssg.dll"
		]
	],
	[
		name: "linux-x64",
		shimIncludes: [
			"libngxshim.so"
		],
		vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Linux_x86_64/${vendorConfig}") },
		vendorIncludes: [
			"libnvidia-ngx-dlssd.so*",
			"libnvidia-ngx-dlssg.so*"
		]
	]
]
def ngxNativePlatformByName = ngxNativePlatforms.collectEntries { platform -> [(platform.name): platform] }
def requestedNgxPlatformsRaw = (findProperty("ngxPlatforms") ?: "current").toString()
		.split(",")
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
def selectedNgxNativePlatforms
if (requestedNgxPlatformsRaw.size() == 1 && requestedNgxPlatformsRaw[0].equalsIgnoreCase("all")) {
	selectedNgxNativePlatforms = ngxNativePlatforms
} else if (requestedNgxPlatformsRaw.size() == 1 && requestedNgxPlatformsRaw[0].equalsIgnoreCase("current")) {
	if (currentNgxPlatform == null || !ngxNativePlatformByName.containsKey(currentNgxPlatform)) {
		throw new GradleException("No NGX native platform is configured for this host.")
	}
	selectedNgxNativePlatforms = [ngxNativePlatformByName[currentNgxPlatform]]
} else {
	def unknownPlatforms = requestedNgxPlatformsRaw.findAll { !ngxNativePlatformByName.containsKey(it) }
	if (!unknownPlatforms.empty) {
		throw new GradleException("Unknown NGX platform(s): ${unknownPlatforms.join(', ')}")
	}
	selectedNgxNativePlatforms = requestedNgxPlatformsRaw.collect { ngxNativePlatformByName[it] }
}

